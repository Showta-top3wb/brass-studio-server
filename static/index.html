<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101216"><title>Brass Studio</title><link rel="stylesheet" href="/static/style.css"></head><body><header><h1>Brass Studio</h1><span>Ver.1.1</span></header><main><section class="card"><h2>音源</h2><input id="audioFile" type="file" accept=".mp3,.wav,.m4a,audio/*"><p id="fileInfo" class="note">MP3・WAV・M4A / 200MB以下</p><audio id="player" controls hidden></audio><p id="error" class="error"></p></section><section class="card"><div class="row"><h2>編成</h2><div><button id="all" class="small">全選択</button><button id="none" class="small">解除</button></div></div><div class="parts"><label><input type="checkbox" name="part" value="trumpet" checked>Trumpet</label><label><input type="checkbox" name="part" value="trombone" checked>Trombone</label><label><input type="checkbox" name="part" value="tenor-sax" checked>Tenor Sax</label><label><input type="checkbox" name="part" value="tuba" checked>Tuba</label><label><input type="checkbox" name="part" value="snare-drum" checked>Snare Drum</label><label><input type="checkbox" name="part" value="bass-drum" checked>Bass Drum</label></div><p id="partsError" class="error"></p></section><section class="card"><h2>設定</h2><label class="field"><span>テンポ</span><select id="tempoMode"><option value="auto">自動解析</option><option value="manual">手動</option></select></label><label id="manualField" class="field" hidden><span>BPM</span><input id="manualBpm" type="number" min="40" max="240" value="120"></label><label class="field"><span>拍子</span><select id="timeSig"><option value="auto">自動解析</option><option value="2/4">2/4</option><option value="3/4">3/4</option><option value="4/4">4/4</option><option value="6/8">6/8</option></select></label></section><button id="analyze" class="primary" disabled>解析する</button><section id="progress" class="card" hidden><div class="row"><h2>解析中</h2><strong>Render</strong></div><div class="bar"><i></i></div><p class="note">音源の長さにより数分かかる場合があります</p></section><section id="result" class="card" hidden><h2>解析結果</h2><div class="stats"><div><span>BPM</span><strong id="bpm">-</strong><small id="bpmConf">-</small></div><div><span>Key</span><strong id="key">-</strong><small id="keyConf">-</small></div><div><span>拍子</span><strong id="time">-</strong><small id="timeConf">-</small></div><div><span>小節数</span><strong id="measures">-</strong><small>推定</small></div></div><p id="notice" class="note"></p><button id="download" class="primary">MusicXMLをダウンロード</button><button id="reset" class="secondary">新しい曲</button></section></main><div id="toast" class="toast" hidden></div><script src="/static/app.js"></script></body></html>
