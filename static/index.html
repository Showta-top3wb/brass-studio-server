<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101216"><title>Brass Studio</title><link rel="stylesheet" href="./style.css"></head><body><header class="topbar"><h1>Brass Studio</h1><span>Ver.1.4.2</span></header><main><section class="card"><h2>音源</h2><input id="audioFile" type="file" accept=".mp3,.wav,.m4a,audio/*"><p id="fileInfo" class="note">MP3・WAV・M4A / 200MB以下</p><audio id="audioPlayer" controls hidden></audio><p id="sourceError" class="error"></p></section><section class="card"><div class="row"><h2>編成</h2><div><button id="selectAll" class="small" type="button">全選択</button><button id="clearAll" class="small" type="button">解除</button></div></div><div class="parts"><label><input type="checkbox" name="part" value="trumpet" checked>Trumpet</label><label><input type="checkbox" name="part" value="trombone" checked>Trombone</label><label><input type="checkbox" name="part" value="tenor-sax" checked>Tenor Sax</label><label><input type="checkbox" name="part" value="tuba" checked>Tuba</label><label><input type="checkbox" name="part" value="snare-drum" checked>Snare Drum</label><label><input type="checkbox" name="part" value="bass-drum" checked>Bass Drum</label></div><p id="partsError" class="error"></p></section><section class="card"><h2>設定</h2><label class="field"><span>曲名</span><input id="songTitle" type="text" maxlength="100" placeholder="ファイル名から自動入力"></label><label class="field"><span>テンポ</span><select id="tempoMode"><option value="auto">自動解析</option><option value="manual">手動</option></select></label><label id="manualTempoField" class="field" hidden><span>BPM</span><input id="manualTempo" type="number" min="40" max="240" value="120"></label><label class="field"><span>拍子</span><select id="timeSignature"><option value="auto">自動解析</option><option value="2/4">2/4</option><option value="3/4">3/4</option><option value="4/4">4/4</option><option value="6/8">6/8</option></select></label></section><button id="analyzeButton" class="primary" type="button" disabled>解析する</button><section id="progressCard" class="card" hidden><div class="row"><h2>解析中</h2><strong id="progressLabel">アップロード中</strong></div><div class="progress"><i></i></div></section><section id="resultCard" class="card" hidden><h2>解析結果</h2><div class="stats"><div><span>BPM</span><strong id="resultBpm">-</strong><small id="bpmConfidence">-</small></div><div><span>Key</span><strong id="resultKey">-</strong><small id="keyConfidence">-</small></div><div><span>拍子</span><strong id="resultTime">-</strong><small id="timeConfidence">-</small></div><div><span>小節数</span><strong id="resultMeasures">-</strong><small>推定</small></div></div><p id="resultNotice" class="note"></p><div class="exports"><button id="musicXmlButton" class="primary" type="button">MusicXML</button><button id="pdfButton" class="secondary" type="button">PDF</button></div><button id="resetButton" class="secondary" type="button">新しい曲</button></section></main><div id="toast" class="toast" hidden></div><script src="./app.js?v=1.4.2"></script></body></html>
